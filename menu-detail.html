<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LaidBack – Detail Menu</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/main.css"/>
  <link rel="icon" type="image/png" href="images/logo.PNG">
</head>
<body>

<!-- ── NAVBAR ── -->
<nav class="navbar">
  <a href="index.html" class="nav-brand">
    <img src="images/logo.PNG" alt="LaidBack Logo" class="nav-logo"/>
    <span class="nav-name">LaidBack</span>
  </a>

  <ul class="nav-links">
    <li><a href="index.html" class="nav-menu-link active">Kembali</a></li>
  </ul>

  <div class="nav-actions">
    <button class="cart-btn" onclick="window.location.href='cart.html'">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
      </svg>
      Keranjang
      <span class="cart-badge" id="cart-badge" style="display:none;">0</span>
    </button>
  </div>
</nav>

<!-- ── DETAIL CONTAINER ── -->
<main class="detail-container" id="detail-root">
  <!-- Content injected by JS -->
</main>

<div id="toast-container"></div>

<script src="js/data.js"></script>
<script src="js/cart.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const itemId = params.get('id');
const item   = getMenuItemById(itemId);
const root   = document.getElementById('detail-root');

if (!item) {
  root.innerHTML = `
    <div style="text-align:center;padding:80px 24px;">
      <div style="font-size:3rem;margin-bottom:20px;opacity:0.3;">🍽️</div>
      <h2 style="font-family:'Playfair Display',serif;font-size:1.8rem;margin-bottom:12px;">Item tidak ditemukan</h2>
      <p style="color:var(--gray-muted);margin-bottom:28px;">Menu yang kamu cari tidak tersedia.</p>
      <button class="btn-primary" onclick="window.location.href='index.html'">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="16" height="16">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
        </svg>
        Kembali ke Menu
      </button>
    </div>
  `;
} else {
  document.title = `LaidBack – ${item.name}`;

  root.innerHTML = `
    <nav class="breadcrumb">
      <a href="index.html">Menu</a>
      <span class="sep">›</span>
      <a href="index.html">${item.category}</a>
      <span class="sep">›</span>
      <span class="current">${item.name}</span>
    </nav>

    <div class="detail-grid">
      <!-- Image -->
      <div class="detail-img-wrap">
        <img src="${item.image}" alt="${item.name}"/>
      </div>

      <!-- Info -->
      <div class="detail-info">
        <span class="detail-badge">${item.category}</span>
        <h1 class="detail-name">${item.name}</h1>
        <div class="detail-price">${formatRp(item.price)}</div>
        <p class="detail-desc">${item.desc}</p>

        <div class="detail-ingredients-label">Bahan-bahan</div>
        <div class="ingredients-tags">
          ${item.ingredients.map(ing => `<span class="ingredient-tag">${ing}</span>`).join('')}
        </div>

        <div class="qty-section">
          <span class="qty-label">Jumlah</span>
          <div class="qty-stepper">
            <button class="qty-btn" id="qty-minus" aria-label="kurangi">−</button>
            <span class="qty-num" id="qty-display">1</span>
            <button class="qty-btn" id="qty-plus" aria-label="tambah">+</button>
          </div>
        </div>

        <button class="add-to-cart-btn" id="atc-btn">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="20" height="20">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
          </svg>
          Masukkan ke Keranjang
        </button>
      </div>
    </div>
  `;

  /* Qty stepper */
  let qty = 1;
  const qtyDisplay = document.getElementById('qty-display');
  const minusBtn   = document.getElementById('qty-minus');
  const plusBtn    = document.getElementById('qty-plus');

  function updateQtyDisplay() {
    qtyDisplay.textContent = qty;
    minusBtn.disabled = qty <= 1;
    plusBtn.disabled  = qty >= 20;
  }

  updateQtyDisplay();

  minusBtn.addEventListener('click', () => { if (qty > 1) { qty--; updateQtyDisplay(); } });
  plusBtn.addEventListener('click',  () => { if (qty < 20) { qty++; updateQtyDisplay(); } });

  /* Add to cart with qty */
  document.getElementById('atc-btn').addEventListener('click', function() {
    const cart = getCart();
    const existing = cart.find(c => c.id === item.id);
    if (existing) {
      existing.qty = Math.min(existing.qty + qty, 20);
    } else {
      cart.push({
        id:          item.id,
        name:        item.name,
        category:    item.category,
        price:       item.price,
        image:       item.image,
        ingredients: item.ingredients,
        qty:         qty
      });
    }
    saveCart(cart);
    showToast(`${item.name} (×${qty}) ditambahkan ke keranjang!`, 'success');
    this.classList.add('added');
    setTimeout(() => this.classList.remove('added'), 500);
  });
}
</script>
</body>
</html>
