<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LaidBack – Keranjang</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/main.css"/>
  <link rel="icon" type="image/png" href="images/logo.PNG">
</head>
<body>

<!-- ── NAVBAR ── -->
<nav class="navbar">
  <a href="index.html" class="nav-brand">
    <img src="images/logo.PNG" alt="LaidBack Logo" class="nav-logo"/>
    <span class="nav-name">LaidBack</span>
  </a>

  <ul class="nav-links">
    <li><a href="index.html" class="nav-menu-link active">Halaman Utama</a></li>
  </ul>

  <div class="nav-actions">
    <button class="cart-btn" onclick="window.location.href='cart.html'">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
      </svg>
      Keranjang
      <span class="cart-badge" id="cart-badge" style="display:none;">0</span>
    </button>
  </div>
</nav>


<!-- ── PAGE HEADER ── -->
<div class="page-header">
  <h1 class="page-title">Keranjang Saya</h1>
  <p class="page-subtitle">Tinjau pesanan Anda sebelum checkout</p>
</div>

<!-- ── CART CONTENT ── -->
<div class="cart-container">
  <div class="cart-layout" id="cart-layout">
    <!-- Injected by JS -->
  </div>
</div>

<div id="toast-container"></div>

<script src="js/data.js"></script>
<script src="js/cart.js"></script>
<script>
const TAX_RATE     = 0.10;
const SERVICE_RATE = 0.05;

function renderCart() {
  const cart   = getCart();
  const layout = document.getElementById('cart-layout');

  if (!cart.length) {
    layout.innerHTML = `
      <div class="cart-empty">
        <div class="cart-empty-icon">🛒</div>
        <h3>Keranjang Masih Kosong</h3>
        <p>Belum ada item dalam keranjangmu. Yuk, mulai pilih menu favoritmu!</p>
        <button class="btn-primary" onclick="window.location.href='index.html'">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="16" height="16">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
          </svg>
          Lihat Menu
        </button>
      </div>
    `;
    return;
  }

  const subtotal = getSubtotal();
  const tax      = Math.round(subtotal * TAX_RATE);
  const service  = Math.round(subtotal * SERVICE_RATE);
  const total    = subtotal + tax + service;

  const itemsHTML = cart.map(item => `
    <div class="cart-item" id="cart-item-${item.id}">
      <img class="cart-item-thumb" src="${item.image}" alt="${item.name}"/>
      <div class="cart-item-info">
        <span class="cart-item-badge">${item.category}</span>
        <div class="cart-item-name">${item.name}</div>
        <ul class="cart-item-ingredients">
          ${item.ingredients.map(i => `<li>${i}</li>`).join('')}
        </ul>
      </div>
      <div class="cart-item-right">
        <div class="cart-item-price">${formatRp(item.price * item.qty)}</div>
        <div class="cart-item-stepper">
          <button class="cart-qty-btn" data-id="${item.id}" data-delta="-1" ${item.qty <= 1 ? 'disabled' : ''}>−</button>
          <span class="cart-qty-num">${item.qty}</span>
          <button class="cart-qty-btn" data-id="${item.id}" data-delta="1" ${item.qty >= 20 ? 'disabled' : ''}>+</button>
        </div>
        <button class="cart-remove-btn" data-id="${item.id}" title="Hapus">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
          </svg>
        </button>
      </div>
    </div>
  `).join('');

  layout.innerHTML = `
    <div class="cart-items-list" id="cart-items-list">
      ${itemsHTML}
    </div>

    <div class="summary-card" id="summary-card">
      <div class="summary-title">Ringkasan Pesanan</div>

      <div class="summary-row">
        <span>Subtotal</span>
        <span id="s-subtotal">${formatRp(subtotal)}</span>
      </div>
      <div class="summary-row">
        <span>Pajak (10%)</span>
        <span id="s-tax">${formatRp(tax)}</span>
      </div>
      <div class="summary-row">
        <span>Biaya Layanan (5%)</span>
        <span id="s-service">${formatRp(service)}</span>
      </div>
      <div class="summary-row total">
        <span>Total</span>
        <span id="s-total">${formatRp(total)}</span>
      </div>

      <button class="checkout-btn" id="checkout-btn" onclick="window.location.href='checkout.html'">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="18" height="18">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 8l4 4m0 0l-4 4m4-4H3"/>
        </svg>
        Bayar Sekarang
      </button>
    </div>
  `;

  bindCartEvents();
}

function bindCartEvents() {
  /* Qty buttons */
  document.querySelectorAll('.cart-qty-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const id    = parseInt(btn.dataset.id);
      const delta = parseInt(btn.dataset.delta);
      updateQty(id, delta);
      updateSummaryInline();
      refreshItemRow(id);
    });
  });

  /* Remove buttons */
  document.querySelectorAll('.cart-remove-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const id  = parseInt(btn.dataset.id);
      const row = document.getElementById(`cart-item-${id}`);
      if (row) {
        row.classList.add('removing');
        setTimeout(() => {
          removeFromCart(id);
          renderCart();
        }, 350);
      }
    });
  });
}

function refreshItemRow(id) {
  const cart = getCart();
  const item = cart.find(c => c.id === id);
  if (!item) return;

  const row = document.getElementById(`cart-item-${id}`);
  if (!row) return;

  const priceEl   = row.querySelector('.cart-item-price');
  const numEl     = row.querySelector('.cart-qty-num');
  const minusBtn  = row.querySelector('[data-delta="-1"]');
  const plusBtn   = row.querySelector('[data-delta="1"]');

  if (priceEl) priceEl.textContent = formatRp(item.price * item.qty);
  if (numEl)   numEl.textContent   = item.qty;
  if (minusBtn) minusBtn.disabled  = item.qty <= 1;
  if (plusBtn)  plusBtn.disabled   = item.qty >= 20;
}

function updateSummaryInline() {
  const subtotal = getSubtotal();
  const tax      = Math.round(subtotal * TAX_RATE);
  const service  = Math.round(subtotal * SERVICE_RATE);
  const total    = subtotal + tax + service;

  const el = (id) => document.getElementById(id);
  if (el('s-subtotal')) el('s-subtotal').textContent = formatRp(subtotal);
  if (el('s-tax'))      el('s-tax').textContent      = formatRp(tax);
  if (el('s-service'))  el('s-service').textContent  = formatRp(service);
  if (el('s-total'))    el('s-total').textContent    = formatRp(total);
}

/* Init */
renderCart();
</script>
</body>
</html>
