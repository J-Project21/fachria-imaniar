<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LaidBack – Pembayaran Berhasil</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/main.css"/>
  <link rel="icon" type="image/png" href="images/logo.PNG">
</head>
<body>

<!-- ── NAVBAR ── -->
<nav class="navbar">
  <a href="index.html" class="nav-brand">
    <img src="images/logo.PNG" alt="LaidBack Logo" class="nav-logo"/>
    <span class="nav-name">LaidBack</span>
  </a>

  <ul class="nav-links">
    <li><a href="index.html" class="nav-menu-link active">Halaman Utama</a></li>
  </ul>

  <div class="nav-actions">
    <button class="cart-btn" onclick="window.location.href='cart.html'">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
      </svg>
      Keranjang
      <span class="cart-badge" id="cart-badge" style="display:none;">0</span>
    </button>
  </div>
</nav>
<!-- ── COMPLETE PAGE ── -->
<main class="complete-page">

  <!-- Inline SVG Illustration: payment scene -->
  <div class="complete-illustration">
    <svg viewBox="0 0 240 220" fill="none" xmlns="http://www.w3.org/2000/svg" width="240" height="220">
      <!-- Background circle -->
      <circle cx="120" cy="110" r="90" fill="#f7ede7" opacity="0.7"/>

      <!-- Phone body -->
      <rect x="85" y="55" width="70" height="110" rx="12" fill="#fff" stroke="#e0dcd8" stroke-width="2"/>
      <rect x="91" y="68" width="58" height="75" rx="6" fill="#faf8f5"/>
      <!-- Phone screen content: dollar -->
      <circle cx="120" cy="93" r="18" fill="#b85c38" opacity="0.15"/>
      <text x="120" y="99" text-anchor="middle" font-size="18" font-family="serif" font-weight="700" fill="#b85c38">$</text>
      <!-- Check mark on phone -->
      <circle cx="120" cy="126" r="9" fill="#b85c38"/>
      <path d="M115.5 126.5 l3 3 l6-6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Phone button -->
      <rect x="112" y="151" width="16" height="5" rx="2.5" fill="#e0dcd8"/>

      <!-- Card left -->
      <rect x="36" y="100" width="60" height="38" rx="8" fill="#c9a070" transform="rotate(-12 66 119)"/>
      <rect x="40" y="107" width="20" height="5" rx="2.5" fill="rgba(255,255,255,0.5)" transform="rotate(-12 50 109)"/>
      <circle cx="84" cy="110" r="6" fill="rgba(255,255,255,0.25)" transform="rotate(-12 84 110)"/>

      <!-- Money / bills right -->
      <rect x="148" y="95" width="54" height="30" rx="6" fill="#4caf50" transform="rotate(8 175 110)"/>
      <rect x="154" y="101" width="42" height="5" rx="2.5" fill="rgba(255,255,255,0.4)" transform="rotate(8 175 103)"/>
      <circle cx="175" cy="113" r="7" fill="rgba(255,255,255,0.3)" transform="rotate(8 175 113)"/>
      <!-- Second bill -->
      <rect x="152" y="102" width="54" height="30" rx="6" fill="#81c784" transform="rotate(14 179 117)"/>
      <rect x="158" y="108" width="42" height="5" rx="2.5" fill="rgba(255,255,255,0.4)" transform="rotate(14 179 110)"/>

      <!-- Wifi / signal arcs top right -->
      <path d="M190 58 Q198 50 206 58" stroke="#b85c38" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <path d="M186 53 Q198 42 210 53" stroke="#b85c38" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
      <circle cx="198" cy="61" r="3" fill="#b85c38"/>

      <!-- Stars sparkle top left -->
      <path d="M46 62 l2-5 l2 5 l5 2 l-5 2 l-2 5 l-2-5 l-5-2z" fill="#c9a070" opacity="0.7"/>
      <path d="M65 45 l1.2-3 l1.2 3 l3 1.2 l-3 1.2 l-1.2 3 l-1.2-3 l-3-1.2z" fill="#c9a070" opacity="0.5"/>

      <!-- Confetti dots -->
      <circle cx="50" cy="155" r="4" fill="#b85c38" opacity="0.4"/>
      <circle cx="185" cy="160" r="3" fill="#4caf50" opacity="0.5"/>
      <circle cx="170" cy="62" r="3" fill="#c9a070" opacity="0.6"/>
      <circle cx="68" cy="170" r="5" fill="#b85c38" opacity="0.25"/>
    </svg>
  </div>

  <h1 class="complete-title">Pembayaran Kamu Berhasil!</h1>
  <p class="complete-subtitle">Hore Pembayaran Mu Telah Selesai</p>

  <button class="back-menu-btn" onclick="window.location.href='index.html'">
    Kembali Ke Menu
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" width="16" height="16">
      <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
    </svg>
  </button>

</main>

<script src="js/data.js"></script>
<script src="js/cart.js"></script>
<script>
/* Clear cart on page load */
clearCart();
updateBadge();
</script>
</body>
</html>
